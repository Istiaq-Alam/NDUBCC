    <style>

        .form-background {

            color: #fff;

            margin: 20px 0;
        }

        .club-title {

            font-size: 21px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            margin-bottom: 15px;
        }

        .form-group label {
            flex: 0 0 220px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            flex: 1;
            border: none;
            border-bottom: 1px solid #000;
            font-size: 14px;
            padding: 4px;
            background: transparent;
        }

        textarea {
            resize: none;
        }

        .form-declaration {
            margin: 30px 0;
            font-size: 16px;
            line-height: 1.6;
            text-align: center;
        }

        .form-declaration input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
        }

        .photo-box {
            align-items: right;
            width: 120px;
            height: 150px;
            border: 1px solid #d1cccc;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            line-height: 150px;
            font-size: 14px;
            margin-left: 20px;
        }

        .photo-box:hover {
            color: #0073e6;
        }

        .photo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .signature-row {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            text-align: center;
            gap: 20px;
            /* space between boxes */
        }

        .signature-box {
            flex: 1;
            /* <-- makes it responsive */
            min-width: 150px;
            /* prevents shrinking too small */
        }

        .signature-preview {
            height: 60px;
            /* reserved space for uploaded signature */
            margin-bottom: 2px;
        }

        .signature-preview img {
            max-height: 100%;
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }

        /* Line + text */
        .signature-line {
            display: block;
            border-top: 1px solid black;
            padding-top: 2px;
            font-size: 14px;
            color: #333;
            cursor: pointer;
            white-space: nowrap;
        }

        .signature-line:hover {
            color: #0073e6;
        }

        .submit-btn {
            text-align: center;
            margin-top: 40px;
        }

        button {
            background: #004d40;
            color: #fff;
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #00695c;
        }
    </style>
</head>

    <script>
        // Textarea auto-resize
        document.querySelectorAll("textarea").forEach(el => {
            el.setAttribute("style", "height:" + el.scrollHeight + "px;overflow-y:hidden;");
            el.addEventListener("input", function () {
                this.style.height = "auto";
                this.style.height = (this.scrollHeight) + "px";
            });
        });

        // Photo preview
        function previewPhoto(event) {
            const photoBox = document.getElementById('photoPreview');
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    photoBox.innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:contain;">`;
                }
                reader.readAsDataURL(file);
            }
        }
        // Signature preview should copy
        function previewSignature(event) {
            const img = document.getElementById('signatureImage');
            img.src = URL.createObjectURL(event.target.files[0]);
        }

        // Handle submit
        async function handleSubmit(event) {
            event.preventDefault();

            // Hide buttons
            document.querySelector(".submit-btn").style.display = "none";

            // Show Thank You
            document.getElementById("thankyou_message").style.display = "block";

            // ✅ Create timestamp before rendering
            const now = new Date();
            const timestamp = now.toLocaleString("en-GB", {
                day: "2-digit", month: "2-digit", year: "numeric",
                hour: "2-digit", minute: "2-digit", second: "2-digit"
            });

            // ✅ Generate unique Reg. No.
            const regNo = "REG-" + Date.now(); // Unique ID
            const regElement = document.getElementById("pdfRegNo");
            regElement.innerText = regNo;
            regElement.style.display = "block";

            // ✅ Also set it into hidden input for Google Form
            const regInput = document.getElementById("regNoInput");
            if (regInput) regInput.value = regNo;

            // ✅ Set timestamp in PDF
            const tsElement = document.getElementById("pdfTimestamp");
            tsElement.innerText = "Generated on: " + timestamp;
            tsElement.style.display = "block"; // make visible in PDF

            // Generate PDF
            const { jsPDF } = window.jspdf;
            const element = document.getElementById("formBackground");

            const canvas = await html2canvas(element, {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                logging: false
            });

            const imgData = canvas.toDataURL("image/png");

            const pdf = new jsPDF("p", "mm", "a4");
            const pageWidth = 250; // A4 width in mm
            const scaleFactor = 0.8; // 80% scale

            const formWidth = canvas.width;
            const formHeight = canvas.height;

            // Scale proportionally to page width, then apply 80% scale
            const scale = (pageWidth / formWidth) * scaleFactor;

            const imgWidth = formWidth * scale;
            const imgHeight = formHeight * scale;

            // Position at top-center
            const posX = 5;
            const posY = 0; // top margin removed

            pdf.addImage(imgData, "PNG", posX, posY, imgWidth, imgHeight);

            // Get Student ID
            const studentId = document.getElementById("studentId").value.trim();

            // Default name if empty
            const fileName = studentId
                ? `NDUBCC_Registration-${studentId}.pdf`
                : "NDUBCC_Registration.pdf";

            // Save PDF with dynamic name
            pdf.save(fileName);

            // ✅ Hide timestamp again for webpage
            tsElement.style.display = "none";

            // Submit to Google Form after PDF generation
            event.target.submit();
        }

    </script>
