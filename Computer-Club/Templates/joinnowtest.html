<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1024">
    <meta name="description" content="NDUBCC Member Registration Form">
    <title>NDUBCC Registration Form</title>
    <link href="assets/img/NDUBCC-Logo.png" rel="icon">
    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: #f7f7f7;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .form-container {
            /*background: #fff;*/
            border: 2px solid #ffffff;
            /*box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);*/
            padding: 0px;
            max-width: 800px;
            width: 100%;
        }

        /* ===== Watermark Background Class ===== */
        .form-background {
            position: relative;
            background: #ffffff;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            margin: auto;
            border-radius: 0px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            z-index: 0;
        }

        /* Background image layer */
        .form-background .bg-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80%;
            /* adjust size */
            height: 80%;
            background: url("../assets/img/NDUBCC-Logo.png") no-repeat center center;
            background-size: contain;
            /* keeps logo aspect ratio */
            opacity: 0.2;
            /* 20% visible (change to 0.5 for 50%) */
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        /* Content inside form should stay above logo */
        .form-background .form-content {
            position: relative;
            z-index: 0;
        }


        /* ====== Header Section ====== */
        .header-bar {
            font-family: "Arial", serif;
            background: #064420;
            /* Dark Green */
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            text-align: center;
            padding: 20px 0;
            /* only vertical padding */
            width: 100%;
            /* full width of page */
            margin-bottom: 20px;
            /* space below banner */
        }

        .logo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        .club-title {
            text-align: center;
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* ====== Form Fields ====== */
        .form-group {
            display: flex;
            margin-bottom: 15px;
        }

        .form-group label {
            flex: 0 0 220px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            flex: 1;
            border: none;
            border-bottom: 1px solid #000;
            font-size: 14px;
            padding: 4px;
            background: transparent;
        }

        textarea {
            resize: none;
        }

        .form-declaration {
            margin: 30px 0;
            font-size: 16px;
            line-height: 1.6;
            text-align: center;
        }

        .form-declaration input[type="checkbox"] {
            margin-right: 10px;
            transform: scale(1.2);
            /* make checkbox slightly bigger */
        }


        /* ====== Photo Box ====== */
        .photo-box {
            width: 120px;
            height: 150px;
            border: 1px solid #d1cccc;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            line-height: 150px;
            font-size: 12px;
            margin-left: 20px;
        }

        .photo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* ====== Signature Section ====== */
        .signature-section {
            display: flex;
            justify-content: space-between;
            margin-top: 50px;
            text-align: center;
            font-size: 14px;
        }

        .signature-section div {
            width: 30%;
            border-top: 1px solid #000;
            padding-top: 5px;
        }

        /* ====== Button ====== */
        .submit-btn {
            text-align: center;
            margin-top: 40px;
        }

        button {
            background: #004d40;
            color: #fff;
            padding: 10px 25px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #00695c;
        }
    </style>
</head>

<body>
    <div class="form-background">
        <!-- background logo -->
        <div class="bg-logo"></div>
        <form class="form-container" action="https://docs.google.com/forms/d/e/1FAIpQLSeh3s5KZQVn4k9ymNDJavJJeXJW0KlYSJKjkGSWJ-TOOyA1dQ/viewform?usp=dialog" method="POST">

            <!-- ====== Header ====== -->
            <div class="header-bar">
                Notre Dame University Bangladesh
            </div>

            <div class="logo-row">
                <img src="../assets/img/ndubLogo.png" height="100px" width="100px" alt="NDUB Logo">
                <img src="../assets/img/NDUBCC-Logo.png" height="100px" width="120px" alt="NDUBCC Logo">
            </div>

            <div class="club-title">
                Notre Dame University Bangladesh Computer Club (NDUBCC)
                <hr>
            </div>

            <!-- ====== Form Fields ====== -->
            <div class="form-group">
                <label>Student ID:</label>
                <input type="text" name="entry.1148792901" required>
            </div>

            <div class="form-group">
                <label>Student's Name:</label>
                <input type="text" name="entry.1674684885" required>
            </div>

            <div class="form-group">
                <label>Mother's Name:</label>
                <input type="text" name="entry.552350917" required>
            </div>

            <div class="form-group">
                <label>Father's Name:</label>
                <input type="text" name="entry.1326660467" required>
            </div>

            <div class="form-group">
                <label>Gender:</label>
                <select name="entry.945839914" required>
                    <option value="">Select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Student's Contact No.:</label>
                <input type="text" name="entry.819871481" required>
            </div>

            <div class="form-group">
                <label>Guardian's Contact No.:</label>
                <input type="text" name="entry.893423479" required>
            </div>

            <div class="form-group">
                <label>Present Semester:</label>
                <input type="text" name="entry.1313498895" required>
            </div>

            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" name="entry.218947294" required>
            </div>

            <div class="form-group">
                <label>Interests and Activities:</label>
                <textarea name="entry.126272351" rows="2" required></textarea>
            </div>

            <div class="form-group">
                <label>Purpose of Joining the Club:</label>
                <textarea name="entry.703563326" rows="2" required></textarea>
            </div>

            <br>
            <!-- ====== Declaration Section ====== -->
            <div class="form-declaration">
                <label>
                    <input type="checkbox" name="entry.2089763498" required>
                    I promise that I will abide by all the rules and regulations of
                    <strong>Notre Dame University Bangladesh Computer Club.</strong>
                    <br>If I violate any of the club rules, the club authority will have all the rights
                    to take necessary step for me.
                </label>
            </div>


            <!-- ====== Photo Box ====== -->
            <div class="photo-row">
                <button>Upload Photo</button>
                <div class="photo-box">PP Size Photo</div>
            </div>
            <p style="text-align: center;">
                <i>The membership of the above mentioned applicant is approved</i></p>
            <!-- ====== Signatures ====== -->
            <div class="signature-section">
                <div>Upload<br>Applicant's Signature</div>
                <div>Moderator,<br>NDUBCC </div>
                <div>Co-Moderator,<br>NDUBCC </div>
            </div>

            <!-- ====== Submit Button ====== -->
            <div class="submit-btn">
                <button type="submit">Submit</button>
            </div>
        </form>
</body>
<script>
    document.querySelectorAll("textarea").forEach(function(el) {
  el.setAttribute("style", "height:" + el.scrollHeight + "px;overflow-y:hidden;");
  el.addEventListener("input", function() {
    this.style.height = "auto";
    this.style.height = (this.scrollHeight) + "px";
  });
});

</script>
</html>
