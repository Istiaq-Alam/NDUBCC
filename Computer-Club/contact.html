<div class="container-xxl py-5">
  <div class="container">
    <div class="text-center wow fadeInUp" data-wow-delay="0.1s">
      <h6 class="section-title bg-white text-center text-primary px-3">Contact</h6>
      <h1 class="mb-5">Get in Touch With Us</h1>
    </div>

    <div class="row g-4">
      
      <!-- Contact Info -->
      <div class="col-lg-5 col-md-6 wow fadeInUp" data-wow-delay="0.1s">
        <div class="card shadow-sm border-0 rounded-3 h-100">
          <div class="card-body p-4">
            <h5 class="mb-4">Contact Information</h5>
            <div class="d-flex align-items-center mb-3">
              <i class="fa fa-map-marker-alt text-primary me-3"></i>
              <span>Notre Dame University Bangladesh <br>
          2/A, Arambagh, Motijheel, GPO Box 7, <br> Dhaka-1000, Bangladesh</span>
            </div>
            <div class="d-flex align-items-center mb-3">
              <i class="fa fa-phone-alt text-primary me-3"></i>
              <span>+880 1234 567 890</span>
            </div>
            <div class="d-flex align-items-center mb-3">
              <i class="fa fa-envelope text-primary me-3"></i>
              <span>computerclub.ndub@gmail.com</span>
            </div>
            <div class="d-flex align-items-center">
              <i class="fa fa-globe text-primary me-3"></i>
              <span>ndubcc.pages.dev</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Form -->
      <div class="col-lg-7 col-md-6 wow fadeInUp" data-wow-delay="0.3s">
        <div class="card shadow-lg border-0 rounded-3">
          <div class="card-body p-4 p-lg-5">
            <form action="https://formspree.io/f/xkgqwbaq" method="POST">
              <div class="row g-3">
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="text" class="form-control border" name="name" placeholder="Your Name" required>
                    <label>Your Name</label>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-floating">
                    <input type="email" class="form-control border" name="email" placeholder="Your Email" required>
                    <label>Your Email</label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-floating">
                    <input type="text" class="form-control border" name="subject" placeholder="Subject">
                    <label>Subject</label>
                  </div>
                </div>
                <div class="col-12">
                  <div class="form-floating">
                    <textarea class="form-control border" name="message" style="height: 150px" placeholder="Message"
                      required></textarea>
                    <label>Message</label>
                  </div>
                </div>
                <div class="col-12 text-center">
                  <button class="btn btn-primary px-5 py-3 mt-3" type="submit">
                    Send Message <i class="fa fa-paper-plane ms-2"></i>
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
