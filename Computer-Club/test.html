<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDUB Computer Club</title>
    
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Optional: Custom CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }
        main {
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <h1>NDUB Computer Club</h1>
</header>

<main>
    <h2>Welcome to our website!</h2>
    <p>Stay updated with our latest events and highlights.</p>
</main>

<script>
    // Array of news / highlights with images
    const news = [
        {
            title: "NDUB CSE Hackathon",
            text: "Join our upcoming coding hackathon this weekend!",
            image: "assets/img/carousel-2.jpg"
        },
        {
            title: "AI & ML Workshop",
            text: "Learn AI & Machine Learning with our hands-on workshop next Monday.",
            image: "https://images.unsplash.com/photo-1581090700227-1050f91a1dc6?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwxNjA3fDB8MHwxfHNlYXJjaHwyfHxhaSUyMG1sJTIwd29ya3Nob3B8ZW58MHx8fHwxNjkzMjU1NTg0&ixlib=rb-4.0.3&q=80&w=400"
        },
        {
            title: "Robotics Competition Winner",
            text: "Congratulations to our students for winning 1st place in inter-college robotics!",
            image: "https://images.unsplash.com/photo-1595429121253-55dcdf1f29b3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwxNjA3fDB8MHwxfHNlYXJjaHwzfHxyb2JvdGljc3xlbnwwfHx8fDE2OTMyNTU2MTE&ixlib=rb-4.0.3&q=80&w=400"
        },
        {
            title: "Monthly Newsletter",
            text: "Subscribe to our newsletter to get the latest updates from the club.",
            image: "https://images.unsplash.com/photo-1604908177521-48b94e4b65d3?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwxNjA3fDB8MHwxfHNlYXJjaHw0fHxibG9nJTIwbmV3c2xldHRlcnxlbnwwfHx8fDE2OTMyNTU2MzY&ixlib=rb-4.0.3&q=80&w=400"
        }
    ];

    // Function to show a random popup
    function showRandomPopup() {
        const randomIndex = Math.floor(Math.random() * news.length);
        const item = news[randomIndex];

        Swal.fire({
            title: item.title,
            text: item.text,
            imageUrl: item.image,
            imageWidth: 400,
            imageHeight: 200,
            imageAlt: item.title,
            icon: 'info',
            confirmButtonText: 'Close',
            timer: 10000,
            timerProgressBar: true
        });
    }

    // Show popup when page loads
    window.addEventListener('load', showRandomPopup);
</script>

</body>
</html>
